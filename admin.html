<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Panel – Bhandara Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --saffron:#E8541E;--saffron-dark:#B53E12;
  --bg:#0F0A06;--card:#1C1410;--border:#2E2018;--text:#F0E8D8;--muted:#8A7060;
  --open:#3DBA6C;--open-bg:rgba(61,186,108,.15);
  --upcoming:#E8B030;--upcoming-bg:rgba(232,176,48,.15);
  --closed:#666;--closed-bg:rgba(100,100,100,.15);
  --danger:#E85050;--danger-bg:rgba(232,80,80,.12);
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── AUTH SCREENS ── */
.auth-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:100}
.auth-screen.hidden{display:none}
.auth-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px;width:380px;max-width:92vw}
.auth-logo{font-size:38px;text-align:center;margin-bottom:8px}
.auth-box h2{text-align:center;font-size:20px;font-weight:600;margin-bottom:4px}
.auth-box .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px}
.auth-box label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;margin-top:14px}
.auth-box label:first-of-type{margin-top:0}
.auth-box input{width:100%;background:#0A0704;border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:14px;font-family:inherit;color:var(--text);outline:none;transition:.15s}
.auth-box input:focus{border-color:var(--saffron)}
.auth-btn{width:100%;background:var(--saffron);color:#fff;border:none;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.auth-btn:hover{background:var(--saffron-dark)}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-link{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--saffron);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:inherit;width:100%}
.auth-link:hover{color:#fff}
.auth-error{background:var(--danger-bg);border:1px solid rgba(232,80,80,.3);color:var(--danger);border-radius:9px;padding:10px 14px;font-size:13px;margin-top:14px;display:none}
.auth-success{background:var(--open-bg);border:1px solid rgba(61,186,108,.3);color:var(--open);border-radius:9px;padding:10px 14px;font-size:13px;margin-top:14px;display:none}
.back-link{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer;background:none;border:none;font-family:inherit;width:100%}
.back-link:hover{color:var(--text)}

/* ── ADMIN APP ── */
#adminApp{display:none}
header{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px}
.header-inner{max-width:1300px;margin:0 auto;height:62px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.header-brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
.header-brand span{color:var(--saffron)}
.admin-badge{background:var(--saffron);color:#fff;font-size:11px;font-weight:600;padding:2px 9px;border-radius:6px;letter-spacing:.5px}
.header-user{font-size:12px;color:var(--muted)}
.header-actions{display:flex;gap:10px;align-items:center}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;text-decoration:none;display:inline-block}
.btn-outline:hover{border-color:var(--saffron);color:var(--saffron)}
.btn-danger-outline{border-color:rgba(232,80,80,.4);color:var(--danger)}
.btn-danger-outline:hover{background:var(--danger-bg);border-color:var(--danger)}
main{max-width:1300px;margin:0 auto;padding:28px 24px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:28px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:500}
.stat .value{font-size:30px;font-weight:600;margin-top:6px;line-height:1}
.stat.open .value{color:var(--open)}.stat.upcoming .value{color:var(--upcoming)}.stat.pending .value{color:var(--saffron)}
.tabs{display:flex;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:24px;width:fit-content}
.tab{background:transparent;border:none;color:var(--muted);padding:8px 20px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:.15s;position:relative}
.tab.active{background:var(--saffron);color:#fff}
.tab .nbadge{position:absolute;top:4px;right:4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 4px}
.section{display:none}.section.active{display:block}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.table-top{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.table-top h2{font-size:16px;font-weight:600}
.search-wrap{position:relative}
.search-wrap input{background:#0A0704;border:1px solid var(--border);border-radius:9px;padding:8px 14px 8px 34px;font-size:13px;font-family:inherit;color:var(--text);outline:none;width:220px}
.search-wrap input:focus{border-color:var(--saffron)}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:12px 16px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border);background:#0A0704}
.tbl td{padding:13px 16px;font-size:13.5px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:none}.tbl tbody tr:hover{background:rgba(255,255,255,.02)}
.status-badge{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;display:inline-block}
.status-badge.open{background:var(--open-bg);color:var(--open)}.status-badge.upcoming{background:var(--upcoming-bg);color:var(--upcoming)}.status-badge.closed{background:var(--closed-bg);color:var(--closed)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;border:none;transition:.15s}
.btn-approve{background:var(--open-bg);color:var(--open);border:1px solid rgba(61,186,108,.3)}.btn-approve:hover{background:var(--open);color:#fff}
.btn-reject{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(232,80,80,.3)}.btn-reject:hover{background:var(--danger);color:#fff}
.btn-edit{background:rgba(232,176,48,.12);color:var(--upcoming);border:1px solid rgba(232,176,48,.3)}.btn-edit:hover{background:var(--upcoming);color:#fff}
.btn-delete{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(232,80,80,.3)}.btn-delete:hover{background:var(--danger);color:#fff}
.btn-toggle{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border)}.btn-toggle:hover{border-color:var(--saffron);color:var(--saffron)}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}.empty .icon{font-size:40px;margin-bottom:12px}
#modalOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center}
#modalOverlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;width:560px;max-width:94vw;max-height:90vh;overflow-y:auto}
.modal h3{font-size:18px;font-weight:600;margin-bottom:20px}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mg-full{grid-column:1/-1}
.modal label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:5px}
.modal input,.modal select,.modal textarea{width:100%;background:#0A0704;border:1px solid var(--border);border-radius:9px;padding:10px 13px;font-size:14px;font-family:inherit;color:var(--text);outline:none}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--saffron)}
.modal textarea{resize:vertical;min-height:70px}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.modal-actions button{padding:10px 22px;border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;border:none}
.btn-save{background:var(--saffron);color:#fff}.btn-cancel{background:transparent;color:var(--muted);border:1px solid var(--border)!important}
#toast{position:fixed;bottom:24px;right:24px;background:#1E3A2B;color:var(--open);border:1px solid rgba(61,186,108,.3);border-radius:12px;padding:13px 20px;font-size:14px;font-weight:500;z-index:300;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:translateY(0)}#toast.error{background:#3A1E1E;color:var(--danger);border-color:rgba(232,80,80,.3)}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:700px){.modal-grid{grid-template-columns:1fr}.mg-full{grid-column:1}main{padding:16px 12px}}
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div class="auth-screen" id="loginScreen">
  <div class="auth-box">
    <div class="auth-logo">🚩</div>
    <h2>Admin Login</h2>
    <p class="sub">Bhandara Live — Lucknow</p>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
    <label>Password</label>
    <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="auth-error" id="loginError"></div>
    <button class="auth-btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    <button class="auth-link" onclick="showForgot()">Forgot password?</button>
  </div>
</div>

<!-- ── FORGOT PASSWORD SCREEN ── -->
<div class="auth-screen hidden" id="forgotScreen">
  <div class="auth-box">
    <div class="auth-logo">🔐</div>
    <h2>Reset Password</h2>
    <p class="sub">Enter your admin email — we'll send a reset link instantly</p>
    <label>Admin Email</label>
    <input type="email" id="resetEmail" placeholder="your@email.com" autocomplete="email">
    <div class="auth-error" id="resetError"></div>
    <div class="auth-success" id="resetSuccess"></div>
    <button class="auth-btn" id="resetBtn" onclick="doReset()">Send Reset Link</button>
    <button class="back-link" onclick="showLogin()">← Back to Login</button>
  </div>
</div>

<!-- ── ADMIN APP ── -->
<div id="adminApp">
  <header>
    <div class="header-inner">
      <div class="header-brand">
        <span>🚩</span> Bhandara Live <span class="admin-badge">ADMIN</span>
      </div>
      <div class="header-actions">
        <span class="header-user" id="headerEmail"></span>
        <a href="index.html" class="btn-outline">← Public Site</a>
        <button class="btn-outline btn-danger-outline" onclick="doLogout()">Logout</button>
      </div>
    </div>
  </header>

  <main>
    <div class="stats-row">
      <div class="stat pending"><div class="label">Pending Approval</div><div class="value" id="sPending">—</div></div>
      <div class="stat open"><div class="label">Open Now</div><div class="value" id="sOpen">—</div></div>
      <div class="stat upcoming"><div class="label">Upcoming</div><div class="value" id="sUpcoming">—</div></div>
      <div class="stat"><div class="label">Total Published</div><div class="value" id="sTotal">—</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('pending',this)">Pending <span class="nbadge" id="pendingBadge">0</span></button>
      <button class="tab" onclick="switchTab('approved',this)">Published</button>
    </div>

    <div class="section active" id="pendingSection">
      <div class="table-wrap">
        <div class="table-top">
          <h2>⏳ Awaiting Approval</h2>
          <div class="search-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="pendingSearch" placeholder="Search…" oninput="filterPending()">
          </div>
        </div>
        <div style="overflow-x:auto"><table class="tbl" id="pendingTable"></table></div>
      </div>
    </div>

    <div class="section" id="approvedSection">
      <div class="table-wrap">
        <div class="table-top">
          <h2>✅ Published Bhandaras</h2>
          <div class="search-wrap">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="approvedSearch" placeholder="Search…" oninput="filterApproved()">
          </div>
        </div>
        <div style="overflow-x:auto"><table class="tbl" id="approvedTable"></table></div>
      </div>
    </div>
  </main>
</div>

<!-- ── EDIT MODAL ── -->
<div id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3>Edit Bhandara</h3>
    <div class="modal-grid">
      <div><label>Name</label><input id="e_name"></div>
      <div><label>Organiser</label><input id="e_organiser"></div>
      <div><label>Location</label><input id="e_location"></div>
      <div><label>Date</label><input id="e_date" type="date"></div>
      <div><label>Time</label><input id="e_time" type="time"></div>
      <div><label>Status</label>
        <select id="e_status">
          <option value="upcoming">Upcoming</option>
          <option value="open">Open</option>
          <option value="closed">Closed</option>
        </select>
      </div>
      <div><label>Menu</label><input id="e_menu"></div>
      <div><label>Contact</label><input id="e_contact"></div>
      <div><label>Image URL</label><input id="e_image"></div>
      <div><label>Maps Link</label><input id="e_maps"></div>
      <div class="mg-full"><label>Address</label><textarea id="e_address"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel btn-sm" onclick="closeModal()">Cancel</button>
      <button class="btn-sm btn-save" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-ipTl8oOWnymlI9z5aTFVG98oAIXlJhg",
  authDomain: "bhandara-c47c6.firebaseapp.com",
  databaseURL: "https://bhandara-c47c6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bhandara-c47c6",
  storageBucket: "bhandara-c47c6.firebasestorage.app",
  messagingSenderId: "908341072237",
  appId: "1:908341072237:web:e865cb2a00b58ee3cb8a64"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

let allApproved = [];
let allPending  = [];
let editingFbKey   = null;
let editingSource  = null;
let pendingSearchQ = '';
let approvedSearchQ= '';
let dbListenersStarted = false;

// ── AUTH STATE ──
onAuthStateChanged(auth, user => {
  if(user){
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('forgotScreen').classList.add('hidden');
    document.getElementById('adminApp').style.display = 'block';
    document.getElementById('headerEmail').textContent = user.email;
    if(!dbListenersStarted){ dbListenersStarted=true; startListeners(); }
  } else {
    document.getElementById('adminApp').style.display = 'none';
    showLogin();
  }
});

// ── SCREEN NAVIGATION ──
window.showLogin = function(){
  document.getElementById('forgotScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginError').style.display='none';
};
window.showForgot = function(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('forgotScreen').classList.remove('hidden');
  document.getElementById('resetError').style.display='none';
  document.getElementById('resetSuccess').style.display='none';
  document.getElementById('resetEmail').value = document.getElementById('loginEmail').value || '';
};

// ── LOGIN ──
window.doLogin = async function(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');
  errEl.style.display='none';
  if(!email||!pass){ errEl.textContent='Please enter email and password.'; errEl.style.display='block'; return; }
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Signing in…';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e){
    errEl.textContent = friendlyError(e.code);
    errEl.style.display='block';
    btn.disabled=false; btn.textContent='Sign In';
  }
};

// ── LOGOUT ──
window.doLogout = async function(){
  await signOut(auth);
};

// ── FORGOT PASSWORD ──
window.doReset = async function(){
  const email  = document.getElementById('resetEmail').value.trim();
  const errEl  = document.getElementById('resetError');
  const succEl = document.getElementById('resetSuccess');
  const btn    = document.getElementById('resetBtn');
  errEl.style.display='none'; succEl.style.display='none';
  if(!email){ errEl.textContent='Please enter your email address.'; errEl.style.display='block'; return; }
  btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Sending…';
  try{
    await sendPasswordResetEmail(auth, email);
    succEl.textContent = '✅ Reset link sent to ' + email + '. Check your inbox (and spam folder).';
    succEl.style.display='block';
    btn.textContent='Sent!';
  } catch(e){
    errEl.textContent = friendlyError(e.code);
    errEl.style.display='block';
    btn.disabled=false; btn.textContent='Send Reset Link';
  }
};

function friendlyError(code){
  const map = {
    'auth/user-not-found':'No admin account found with this email.',
    'auth/wrong-password':'Incorrect password. Try again or use Forgot Password.',
    'auth/invalid-email':'Please enter a valid email address.',
    'auth/too-many-requests':'Too many attempts. Please wait a few minutes.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/network-request-failed':'Network error. Check your connection.'
  };
  return map[code] || 'Something went wrong. Please try again.';
}

// ── FIREBASE DB LISTENERS ──
function startListeners(){
  onValue(ref(db,'approved'), snap=>{
    allApproved=[];
    if(snap.exists()) snap.forEach(c=>allApproved.push({fbKey:c.key,...c.val()}));
    renderApproved(); renderStats();
  });
  onValue(ref(db,'pending'), snap=>{
    allPending=[];
    if(snap.exists()) snap.forEach(c=>allPending.push({fbKey:c.key,...c.val()}));
    renderPending(); renderStats();
  });
}

// ── STATS ──
function renderStats(){
  document.getElementById('sPending').textContent  = allPending.length;
  document.getElementById('sOpen').textContent     = allApproved.filter(b=>b.status==='open').length;
  document.getElementById('sUpcoming').textContent = allApproved.filter(b=>b.status==='upcoming').length;
  document.getElementById('sTotal').textContent    = allApproved.length;
  const badge = document.getElementById('pendingBadge');
  badge.textContent = allPending.length;
  badge.style.display = allPending.length ? 'flex' : 'none';
}

// ── PENDING TABLE ──
function renderPending(){
  const data = allPending.filter(b =>
  !pendingSearchQ ||
  (b.name || '').toLowerCase().includes(pendingSearchQ) ||
  (b.location || '').toLowerCase().includes(pendingSearchQ)
);
  const tbl  = document.getElementById('pendingTable');
  const hdr  = `<thead><tr><th>Name</th><th>Location</th><th>Date</th><th>Menu</th><th>Contact</th><th>Submitted</th><th>Actions</th></tr></thead>`;
  if(!data.length){ tbl.innerHTML=hdr+`<tbody><tr><td colspan="7"><div class="empty"><div class="icon">🎉</div><p>No pending submissions</p></div></td></tr></tbody>`; return; }
  tbl.innerHTML=hdr+`<tbody>${data.map(b=>{
    const sub = b.submittedAt ? new Date(b.submittedAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) : '—';
    return `<tr>
      <td><strong>${b.name}</strong><br><span style="font-size:12px;color:var(--muted)">${b.organiser||''}</span></td>
      <td>${b.location}</td>
      <td>${b.date}${b.time?'<br><span style="font-size:12px;color:var(--muted)">'+b.time+'</span>':''}</td>
      <td style="max-width:130px;font-size:13px">${b.menu}</td>
      <td style="font-size:13px">${b.contact||'—'}</td>
      <td style="font-size:12px;color:var(--muted)">${sub}</td>
      <td><div class="actions">
        <button class="btn-sm btn-approve" onclick="approve('${b.fbKey}')">✓ Approve</button>
        <button class="btn-sm btn-edit"    onclick="openEdit('${b.fbKey}','pending')">✎ Edit</button>
        <button class="btn-sm btn-reject"  onclick="reject('${b.fbKey}')">✗ Reject</button>
      </div></td>
    </tr>`;
  }).join('')}</tbody>`;
}

// ── APPROVED TABLE ──
function renderApproved(){
  const data = [...allApproved]
    .filter(b =>
      !approvedSearchQ ||
      (b.name || '').toLowerCase().includes(approvedSearchQ) ||
      (b.location || '').toLowerCase().includes(approvedSearchQ)
    )
    .sort((a,b)=>a.date.localeCompare(b.date));
  const tbl = document.getElementById('approvedTable');
  const hdr = `<thead><tr><th>Name</th><th>Location</th><th>Date</th><th>Status</th><th>Menu</th><th>Contact</th><th>Actions</th></tr></thead>`;
  if(!data.length){ tbl.innerHTML=hdr+`<tbody><tr><td colspan="7"><div class="empty"><div class="icon">📭</div><p>No published bhandaras</p></div></td></tr></tbody>`; return; }
  tbl.innerHTML=hdr+`<tbody>${data.map(b=>`<tr>
    <td><strong>${b.name}</strong><br><span style="font-size:12px;color:var(--muted)">${b.organiser||''}</span></td>
    <td>${b.location}</td>
    <td>${b.date}${b.time?'<br><span style="font-size:12px;color:var(--muted)">'+b.time+'</span>':''}</td>
    <td><span class="status-badge ${b.status}">${b.status}</span></td>
    <td style="max-width:130px;font-size:13px">${b.menu}</td>
    <td style="font-size:13px">${b.contact||'—'}</td>
    <td><div class="actions">
      <button class="btn-sm btn-toggle" onclick="cycleStatus('${b.fbKey}','${b.status}')">⟳ Status</button>
      <button class="btn-sm btn-edit"   onclick="openEdit('${b.fbKey}','approved')">✎ Edit</button>
      <button class="btn-sm btn-delete" onclick="deleteApproved('${b.fbKey}')">✗ Delete</button>
    </div></td>
  </tr>`).join('')}</tbody>`;
}

// ── ACTIONS ──
window.approve = async function(fbKey){
  const item = allPending.find(b=>b.fbKey===fbKey);
  if(!item) return;
  const {fbKey:_, ...data} = item;
  try{
    await push(ref(db,'approved'), data);
    await remove(ref(db,'pending/'+fbKey));
    showToast('✅ Bhandara approved and published!');
  } catch(e){ showToast('Error: '+e.message,'error'); }
};

window.reject = async function(fbKey){
  if(!confirm('Reject and delete this submission?')) return;
  try{
    await remove(ref(db,'pending/'+fbKey));
    showToast('Submission rejected.','error');
  } catch(e){ showToast('Error: '+e.message,'error'); }
};

window.deleteApproved = async function(fbKey){
  if(!confirm('Permanently delete this published bhandara?')) return;
  try{
    await remove(ref(db,'approved/'+fbKey));
    showToast('Bhandara deleted.','error');
  } catch(e){ showToast('Error: '+e.message,'error'); }
};

window.cycleStatus = async function(fbKey, currentStatus){
  const cycle = {open:'closed', upcoming:'open', closed:'upcoming'};
  try{
    await update(ref(db,'approved/'+fbKey), {status: cycle[currentStatus]||'upcoming'});
    showToast('Status updated to: '+(cycle[currentStatus]||'upcoming'));
  } catch(e){ showToast('Error: '+e.message,'error'); }
};

// ── EDIT MODAL ──
window.openEdit = function(fbKey, source){
  const data = source==='approved' ? allApproved : allPending;
  const b = data.find(x=>x.fbKey===fbKey);
  if(!b) return;
  editingFbKey=fbKey; editingSource=source;
  ['name','organiser','location','date','time','menu','contact','image','address','maps'].forEach(f=>{
    document.getElementById('e_'+f).value = b[f]||'';
  });
  document.getElementById('e_status').value = b.status||'upcoming';
  document.getElementById('modalOverlay').classList.add('open');
};

window.closeModal = function(){
  document.getElementById('modalOverlay').classList.remove('open');
  editingFbKey=null; editingSource=null;
};

window.saveEdit = async function(){
  if(!editingFbKey) return;
  const updated = {};
  ['name','organiser','location','date','time','menu','contact','image','address','maps'].forEach(f=>{
    updated[f] = document.getElementById('e_'+f).value.trim();
  });
  updated.status = document.getElementById('e_status').value;
  const path = (editingSource==='approved'?'approved/':'pending/')+editingFbKey;
  try{
    await update(ref(db, path), updated);
    closeModal(); showToast('✅ Changes saved!');
  } catch(e){ showToast('Error: '+e.message,'error'); }
};

// ── TABS & SEARCH ──
window.switchTab = function(tab, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('pendingSection').classList.toggle('active', tab==='pending');
  document.getElementById('approvedSection').classList.toggle('active', tab==='approved');
};
window.filterPending  = function(){ pendingSearchQ  = document.getElementById('pendingSearch').value.toLowerCase();  renderPending(); };
window.filterApproved = function(){ approvedSearchQ = document.getElementById('approvedSearch').value.toLowerCase(); renderApproved(); };

// ── TOAST ──
function showToast(msg, type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show'+(type?' '+type:'');
  setTimeout(()=>t.className='', 3200);
}
</script>
</body>
</html>
